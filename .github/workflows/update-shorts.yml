# Refreshes data/shorts.json from the YouTube channel feed, every morning (06:00 UTC).
name: Update shorts

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_videos.py shorts
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/shorts.json; then echo "No new videos"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shorts.json
          git commit -m "Update shorts videos"
          git push
