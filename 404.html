<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ink of Sinai: the Torah, up close</title>
<meta name="description" content="The Torah up close, straight from the Hebrew text. Coming soon.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/media/icon-180.png">
<meta name="theme-color" content="#ece3cf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)">
<style>
:root { --bg: #ece3cf; --fg: #1d1813; --muted: #5a4f42; --rule: #c9b998; --red: #a3271b; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #17130f; --fg: #ece2cc; --muted: #b5a68c; --rule: #3d3329; --red: #e0705f; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem;
       background: var(--bg); color: var(--fg); font: 400 1.125rem/1.6 Georgia, 'Times New Roman', serif; text-align: center; }
main { max-width: 32rem; }
.mark { font-size: 3rem; line-height: 1; color: var(--red); margin: 0 0 1rem; }
h1 { font-weight: 400; font-size: 2rem; margin: 0 0 .5rem; letter-spacing: -.01em; }
p { margin: 0; color: var(--muted); }
a { color: inherit; text-decoration-color: var(--rule); text-underline-offset: .2em; }
a:hover { text-decoration-color: var(--red); }
</style>
</head>
<body>
<main>
  <p class="mark" aria-hidden="true">א</p>
  <h1>Ink of Sinai</h1>
  <p>The Torah, up close. Coming soon.</p>
  <p style="margin-top:1.5rem"><a href="https://www.instagram.com/inkofsinai/">Follow on Instagram</a></p>
</main>
</body>
</html>
