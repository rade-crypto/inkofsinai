:root { --bg: #120e0a; --panel: #1f1913; --line: #3a2e22; --fg: #efe3cc; --muted: #b9aa90; --dim: #8d7f6a; --red: #b3261e; --red-2: #d64a3a; --gold: #e0a15a; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse 900px 700px at 50% 15%, #3d2a14 0%, var(--bg) 70%) var(--bg); color: var(--fg); font: 400 17px/1.6 Inter, system-ui, sans-serif; display: grid; place-items: center; padding: 40px 20px; }
a { color: inherit; }
main { width: 100%; max-width: 560px; background: rgba(31,25,19,.94); border: 1px solid var(--line); border-radius: 18px; padding: 40px 32px; text-align: center; }
.mark { font: 400 52px/1 'Stam'; color: var(--red-2); }
.brand { margin: 10px 0 26px; font: 600 22px 'Source Serif 4', serif; }
h1 { margin: 0 0 10px; font: 600 36px/1.15 'Source Serif 4', serif; }
p { margin: 0 0 24px; color: var(--muted); }
form { display: grid; gap: 10px; }
input { width: 100%; padding: 15px 16px; border-radius: 8px; border: 1px solid var(--line); background: #2b231b; color: var(--fg); font: inherit; }
input::placeholder { color: var(--dim); }
button { padding: 15px 24px; border: 0; border-radius: 8px; background: var(--red); color: #fff; font: 600 16px Inter, sans-serif; cursor: pointer; }
.status { margin: 6px 0 0; min-height: 1.4em; color: var(--muted); font-size: 15px; }
.back { display: inline-block; margin-top: 22px; color: var(--gold); font-weight: 600; text-decoration: none; }

<body>
<main>
  <div class="mark" lang="he" aria-hidden="true">א</div>
  <div class="brand">Ink of Sinai</div>
  <h1>Every Thursday</h1>
  <p>This week's Torah portion, plus a summary of the week's insights. Free, no ads.</p>
  <form id="signup" method="post" novalidate>
    <div class="form" style="display:grid;gap:10px"><input id="email" name="email_address" type="email" autocomplete="email" placeholder="Your email" aria-label="Email address" required><button type="submit">Subscribe</button></div>
    <p class="status" id="signup-status" role="status" aria-live="polite"></p>
  </form>
  <a class="back" href="/">Watch the videos →</a>
</main>
<span id="yr" hidden></span>
<script>
// Sign-up goes to the Kit form in the background, so readers stay on the page.
// Kit doesn't let the page read its reply, so the email is checked here first.
const SIGNUP = { form: '10075748', liveHost: 'inkofsinai.com' };
(function () {
  const form = document.getElementById('signup'), email = document.getElementById('email'), status = document.getElementById('signup-status');
  const host = location.hostname, live = host === SIGNUP.liveHost || host.endsWith('.' + SIGNUP.liveHost);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!email.value || !email.checkValidity()) { status.textContent = 'Enter an email address like name@example.com.'; email.focus(); return; }
    if (!live) { status.textContent = 'Sign-up works once the site is live at inkofsinai.com.'; return; }
    const button = form.querySelector('button');
    button.disabled = true; status.textContent = 'Subscribing…';
    try {
      await fetch('https://app.kit.com/forms/' + SIGNUP.form + '/subscriptions', {
        method: 'POST', mode: 'no-cors', body: new URLSearchParams({ email_address: email.value.trim() })
      });
      form.querySelector('.form').style.display = 'none';
      status.textContent = "You're in. The next email arrives Thursday.";
    } catch {
      button.disabled = false;
      status.textContent = 'Something went wrong. Please try again in a moment.';
    }
  });
  document.getElementById('yr').textContent = new Date().getFullYear();
})();
</script>
